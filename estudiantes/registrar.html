<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduControl - Registrar estudiante</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body data-seccion="estudiantes" data-rol="ADMIN" data-modo="registrar">
<script>window.EC_BASE = '../';</script>
<div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="contenido">
        <header class="encabezado"><h1>Registrar estudiante</h1></header>
        <div id="mensajes"></div>
        <div id="contenido-pagina"><section class="panel"><form id="form-estudiante" class="formulario" novalidate><div class="campo"><label for="cedula">Cédula *</label><input id="cedula" name="cedula" maxlength="20"><span class="error-texto" data-error="cedula"></span></div><div class="campo"><label for="nombre">Nombre *</label><input id="nombre" name="nombre" maxlength="60"><span class="error-texto" data-error="nombre"></span></div><div class="campo"><label for="apellido">Apellido *</label><input id="apellido" name="apellido" maxlength="60"><span class="error-texto" data-error="apellido"></span></div><div class="campo"><label for="estado">Estado</label><select id="estado" name="estado"><option value="ACTIVO">ACTIVO</option><option value="INACTIVO">INACTIVO</option><option value="RETIRADO">RETIRADO</option><option value="GRADUADO">GRADUADO</option></select><span class="error-texto" data-error="estado"></span></div><div class="acciones-form"><button type="submit" class="btn btn-primario">Registrar estudiante</button><a class="btn btn-secundario" href="index.html">Cancelar</a></div></form></section></div>
    </main>
</div>
<script src="../js/storage.js"></script>
<script src="../js/configuracion.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/estudiantes-form.js"></script>
</body>
</html>
